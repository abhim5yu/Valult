name: Build Personal Vault APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure persistent signing key
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/personal-vault-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/personal-vault-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
        run: gradle assembleRelease --no-daemon
      - name: Build debug APK (signing secrets not configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' || secrets.RELEASE_STORE_PASSWORD == '' || secrets.RELEASE_KEY_ALIAS == '' || secrets.RELEASE_KEY_PASSWORD == '' }}
        run: |
          echo "::warning::Using a debug-signed APK. Configure all four RELEASE_* secrets for stable in-place updates."
          gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk PersonalVault.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk PersonalVault.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalVault-APK
          path: PersonalVault.apk
          retention-days: 30
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Personal Vault build ${{ github.run_number }}
          body: "Personal Vault APK. Configure the same persistent release signing key for reliable in-place updates."
          files: PersonalVault.apk
          make_latest: true
