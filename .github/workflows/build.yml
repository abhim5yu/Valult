name: Build Personal Vault APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          missing=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Add all 4 secrets (Settings > Secrets and variables > Actions). Without a fixed signing key, Android refuses to install builds over the old app."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/personal-vault-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/personal-vault-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK and show signing fingerprint
        run: |
          cp app/build/outputs/apk/release/app-release.apk PersonalVault.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs PersonalVault.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalVault-APK
          path: PersonalVault.apk
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Personal Vault build ${{ github.run_number }}
          body: "Personal Vault APK. Install over the previous version to update."
          files: PersonalVault.apk
          make_latest: true
