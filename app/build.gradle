plugins { id 'com.android.application' }

android {
    namespace 'com.abhim5yu.personalvault'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abhim5yu.personalvault'
        minSdk 29
        targetSdk 34
        // Every CI build gets a higher versionCode, so Android always accepts it as an update.
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 100 + run
        versionName "1.3.${run}"
    }
    signingConfigs {
        release {
            def ks = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
